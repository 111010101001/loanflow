name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit tests only for now; integration tests with Testcontainers come in step 4
      # (GitHub's ubuntu runners have Docker, so they'll run here too).
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
